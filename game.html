<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<title>DinoRace</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* Game sits in the full viewport */
#game-shell{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  background:#fff;
}

/* Top bar */
#topbar{
  height:44px;background:#111;color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;flex-shrink:0;font-family:system-ui,sans-serif;
  gap:12px;
}
#topbar .score-block{display:flex;flex-direction:column;align-items:center}
#topbar .score-block .val{font-size:1em;font-weight:800;font-variant-numeric:tabular-nums}
#topbar .score-block .lbl{font-size:.55em;color:#888;text-transform:uppercase;letter-spacing:.05em}
#topbar .divider{width:1px;height:24px;background:#333}
#menu-btn{background:#333;border:none;color:#fff;padding:6px 12px;border-radius:6px;
  font-size:.78em;font-weight:700;cursor:pointer}

/* Game canvas area */
#game-area{
  flex:1;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* These classes are required by the Runner engine — DO NOT rename */
.interstitial-wrapper{position:relative;width:100%;height:100%}
.runner-container{
  direction:ltr;height:150px;overflow:hidden;
  position:absolute;top:0;left:0;width:44px;outline:none;
}
.runner-canvas{
  height:150px;opacity:1;position:absolute;top:0;z-index:10;
  image-rendering:-webkit-crisp-edges;image-rendering:pixelated;
}
.offline-runner-live-region{position:absolute;left:-9999px}
.controller{position:fixed;inset:0;z-index:1;cursor:pointer}
.icon,.hidden{display:none}
#offline-resources{display:none}

/* Tap hint */
#tap-hint{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.75);color:#fff;padding:8px 20px;
  border-radius:20px;font-size:.82em;font-family:system-ui,sans-serif;
  pointer-events:none;z-index:30;white-space:nowrap;
  transition:opacity .4s;
}

/* Countdown overlay */
#countdown{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:system-ui,sans-serif;color:#fff;
}
#countdown.gone{display:none}
#cd-num{font-size:5em;line-height:1.2;color:#fff;
  font-family:'Press Start 2P',monospace;
  text-shadow:4px 4px 0 rgba(0,0,0,.45)}
#cd-sub{font-size:.95em;color:#888;margin-top:12px}

/* Game-over overlay */
#gameover{
  position:fixed;inset:0;background:rgba(8,8,18,.30);z-index:200;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  font-family:system-ui,sans-serif;color:#fff;padding:20px;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
#gameover.show{display:flex}
.go-card{
  background:rgba(20,20,36,.42);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border:1px solid rgba(255,255,255,.16);border-radius:20px;
  padding:28px 24px;width:100%;max-width:320px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.35);
}
.go-emoji{margin-bottom:12px}
.go-emoji svg{width:56px;height:56px}
.go-title{font-size:1.1em;margin-bottom:6px;font-family:'Press Start 2P',monospace;letter-spacing:1px}
.go-sub{font-size:.82em;color:#bbb;margin-bottom:20px}
.go-score{font-size:2.2em;color:#fff;font-family:'Press Start 2P',monospace;
  font-variant-numeric:tabular-nums;margin:8px 0}
.go-best{font-size:.78em;color:#aaa;margin-top:8px;margin-bottom:20px}
.go-stats{display:flex;gap:8px;margin-bottom:20px}
.go-stat{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 8px;text-align:center}
.go-stat .v{font-size:1.1em;font-weight:800}
.go-stat .l{font-size:.65em;color:#aaa;margin-top:2px}
.go-btn{width:100%;padding:14px;border-radius:12px;border:none;
  font-size:.95em;font-weight:700;cursor:pointer;margin-bottom:8px}
.go-btn.primary{background:#7c3aed;color:#fff}
.go-btn.secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.14)}

/* Hearts pickup + toast */
.heart-pickup{position:absolute;width:34px;height:30px;z-index:50;pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(244,63,94,.85));
  animation:heart-bob .8s ease-in-out infinite alternate}
.heart-pickup svg{width:100%;height:100%;display:block}
#hud-hearts svg{width:20px;height:18px;margin:0 2px;vertical-align:-3px}
@keyframes heart-bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-8px) scale(1.12)}}
#game-toast{position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-16px);
  background:rgba(20,20,36,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.16);color:#fff;font:700 .85em system-ui,sans-serif;
  padding:8px 16px;border-radius:20px;opacity:0;transition:all .3s;z-index:300;
  pointer-events:none;white-space:nowrap}
#game-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Slow-mo booster pickup + badge */
.slowmo-pickup{position:absolute;width:32px;height:32px;z-index:50;pointer-events:none;
  filter:drop-shadow(0 0 10px rgba(56,189,248,.85));
  animation:slowmo-bob .8s ease-in-out infinite alternate}
.slowmo-pickup svg{width:100%;height:100%;display:block}
@keyframes slowmo-bob{from{transform:translateY(0) scale(1)}to{transform:translateY(-8px) scale(1.12)}}
#slowmo-badge{display:none;position:absolute;top:14px;left:14px;z-index:60;
  background:rgba(12,74,110,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(56,189,248,.5);color:#bae6fd;font:700 .8em system-ui,sans-serif;
  padding:8px 14px;border-radius:20px;pointer-events:none;letter-spacing:.5px}
#game-area.slowmo::after{content:'';position:absolute;inset:0;z-index:40;pointer-events:none;
  box-shadow:inset 0 0 80px rgba(56,189,248,.28)}

/* Pause overlay (mirrors #gameover glassmorphism) */
#pausemenu{
  position:fixed;inset:0;background:rgba(8,8,18,.30);z-index:200;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  font-family:system-ui,sans-serif;color:#fff;padding:20px;
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
#pausemenu.show{display:flex}

/* Topbar pause button */
#pause-btn{background:#333;border:none;color:#fff;padding:6px 12px;border-radius:6px;
  font-size:.78em;font-weight:700;cursor:pointer;margin-right:8px;
  display:inline-flex;align-items:center;gap:6px}
#pause-btn svg{width:11px;height:11px;display:block}

/* Dark mode page chrome (canvas follows the game's own day/night cycle) */
@media(prefers-color-scheme:dark){
  html,body,#game-shell,#game-area{background:#111}
  .interstitial-wrapper{background:#111}
}
/* Game's own day/night cycle, triggered by distance */
html.inverted .runner-canvas{filter:invert(1)}
html.inverted #game-area{background:#000}

/* (portrait play supported — no rotation prompt) */
</style>
</head>
<body>

<div id="game-shell">
  <!-- TOP HUD -->
  <div id="topbar">
    <div class="score-block">
      <div class="val" id="hud-score">0</div>
      <div class="lbl">Score</div>
    </div>
    <div class="divider"></div>
    <div class="score-block">
      <div class="val" id="hud-best">0</div>
      <div class="lbl">Best</div>
    </div>
    <div class="divider"></div>
    <div class="score-block">
      <div class="val" id="hud-hearts"></div>
      <div class="lbl">Hearts</div>
    </div>
    <div class="divider"></div>
    <div class="score-block">
      <div class="val" id="hud-speed">6.0</div>
      <div class="lbl">Speed</div>
    </div>
    <div style="flex:1"></div>
    <button id="pause-btn" onclick="doPause()" aria-label="Pause game"><svg viewBox="0 0 12 12" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><g fill="#fff"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></g></svg></button>
  </div>

  <!-- GAME AREA — Runner mounts here -->
  <div id="game-area">
    <div id="main-frame-error" class="interstitial-wrapper">
      <div class="icon icon-offline"></div>
      <div id="main-message"><h1><span id="heading.msg"></span></h1></div>
      <!-- Runner creates .runner-container inside here -->
    </div>
    <div id="tap-hint">Tap anywhere · Space · ↑ to jump</div>
    <div id="slowmo-badge"></div>
    <div id="game-toast"></div>
  </div>
</div>

<!-- COUNTDOWN -->
<div id="countdown">
  <div id="cd-num">3</div>
  <div id="cd-sub">Get ready!</div>
</div>

<!-- GAME OVER -->
<div id="gameover">
  <div class="go-card">
    <div class="go-emoji" id="go-emoji"></div>
    <div class="go-title" id="go-title">Game Over</div>
    <div class="go-sub" id="go-sub">Keep pushing!</div>
    <div class="go-score" id="go-score">0</div>
    <div class="go-best" id="go-best">Best: 0</div>
    <div class="go-stats">
      <div class="go-stat"><div class="v" id="gs-spd">6.0</div><div class="l">Max Speed</div></div>
      <div class="go-stat"><div class="v" id="gs-time">0s</div><div class="l">Time</div></div>
    </div>
    <button class="go-btn primary" onclick="doRestart()">Play Again</button>
    <button class="go-btn secondary" onclick="window.location.href='index.html'">Menu</button>
  </div>
</div>

<!-- PAUSE MENU -->
<div id="pausemenu">
  <div class="go-card">
    <div class="go-title">Paused</div>
    <div class="go-sub">Take a breather.</div>
    <button class="go-btn primary" onclick="doResume()">Resume</button>
    <button class="go-btn secondary" onclick="window.location.href='index.html'">Go to Home</button>
    <button class="go-btn secondary" onclick="window.location.href='index.html?screen=s-leaderboard'">Leaderboards</button>
  </div>
</div>

<script>// Copyright (c) 2012 The Chromium Authors. All rights reserved.

/**
 * @fileoverview This file defines a singleton which provides access to all data
 * that is available as soon as the page's resources are loaded (before DOM
 * content has finished loading). This data includes both localized strings and
 * any data that is important to have ready from a very early stage (e.g. things
 * that must be displayed right away).
 *
 * Note that loadTimeData is not guaranteed to be consistent between page
 * refreshes (https://crbug.com/740629) and should not contain values that might
 * change if the page is re-opened later.
 */

/** @type {!LoadTimeData} */
// eslint-disable-next-line no-var
var loadTimeData;

class LoadTimeData {
  constructor() {
    /** @type {Object} */
    this.data_;
  }

  /**
   * Sets the backing object.
   *
   * Note that there is no getter for |data_| to discourage abuse of the form:
   *
   *     var value = loadTimeData.data()['key'];
   *
   * @param {Object} value The de-serialized page data.
   */
  set data(value) {
    expect(!this.data_, 'Re-setting data.');
    this.data_ = value;
  }

  /**
   * @param {string} id An ID of a value that might exist.
   * @return {boolean} True if |id| is a key in the dictionary.
   */
  valueExists(id) {
    return id in this.data_;
  }

  /**
   * Fetches a value, expecting that it exists.
   * @param {string} id The key that identifies the desired value.
   * @return {*} The corresponding value.
   */
  getValue(id) {
    expect(this.data_, 'No data. Did you remember to include strings.js?');
    const value = this.data_[id];
    expect(typeof value !== 'undefined', 'Could not find value for ' + id);
    return value;
  }

  /**
   * As above, but also makes sure that the value is a string.
   * @param {string} id The key that identifies the desired string.
   * @return {string} The corresponding string value.
   */
  getString(id) {
    const value = this.getValue(id);
    expectIsType(id, value, 'string');
    return /** @type {string} */ (value);
  }

  /**
   * Returns a formatted localized string where $1 to $9 are replaced by the
   * second to the tenth argument.
   * @param {string} id The ID of the string we want.
   * @param {...(string|number)} var_args The extra values to include in the
   *     formatted output.
   * @return {string} The formatted string.
   */
  getStringF(id, var_args) {
    const value = this.getString(id);
    if (!value) {
      return '';
    }

    const args = Array.prototype.slice.call(arguments);
    args[0] = value;
    return this.substituteString.apply(this, args);
  }

  /**
   * Returns a formatted localized string where $1 to $9 are replaced by the
   * second to the tenth argument. Any standalone $ signs must be escaped as
   * $$.
   * @param {string} label The label to substitute through.
   *     This is not an resource ID.
   * @param {...(string|number)} var_args The extra values to include in the
   *     formatted output.
   * @return {string} The formatted string.
   */
  substituteString(label, var_args) {
    const varArgs = arguments;
    return label.replace(/\$(.|$|\n)/g, function(m) {
      expect(m.match(/\$[$1-9]/), 'Unescaped $ found in localized string.');
      return m === '$$' ? '$' : varArgs[m[1]];
    });
  }

  /**
   * Returns a formatted string where $1 to $9 are replaced by the second to
   * tenth argument, split apart into a list of pieces describing how the
   * substitution was performed. Any standalone $ signs must be escaped as $$.
   * @param {string} label A localized string to substitute through.
   *     This is not an resource ID.
   * @param {...(string|number)} var_args The extra values to include in the
   *     formatted output.
   * @return {!Array<!{value: string, arg: (null|string)}>} The formatted
   *     string pieces.
   */
  getSubstitutedStringPieces(label, var_args) {
    const varArgs = arguments;
    // Split the string by separately matching all occurrences of $1-9 and of
    // non $1-9 pieces.
    const pieces = (label.match(/(\$[1-9])|(([^$]|\$([^1-9]|$))+)/g) ||
                    []).map(function(p) {
      // Pieces that are not $1-9 should be returned after replacing $$
      // with $.
      if (!p.match(/^\$[1-9]$/)) {
        expect(
            (p.match(/\$/g) || []).length % 2 === 0,
            'Unescaped $ found in localized string.');
        return {value: p.replace(/\$\$/g, '$'), arg: null};
      }

      // Otherwise, return the substitution value.
      return {value: varArgs[p[1]], arg: p};
    });

    return pieces;
  }

  /**
   * As above, but also makes sure that the value is a boolean.
   * @param {string} id The key that identifies the desired boolean.
   * @return {boolean} The corresponding boolean value.
   */
  getBoolean(id) {
    const value = this.getValue(id);
    expectIsType(id, value, 'boolean');
    return /** @type {boolean} */ (value);
  }

  /**
   * As above, but also makes sure that the value is an integer.
   * @param {string} id The key that identifies the desired number.
   * @return {number} The corresponding number value.
   */
  getInteger(id) {
    const value = this.getValue(id);
    expectIsType(id, value, 'number');
    expect(value === Math.floor(value), 'Number isn\'t integer: ' + value);
    return /** @type {number} */ (value);
  }

  /**
   * Override values in loadTimeData with the values found in |replacements|.
   * @param {Object} replacements The dictionary object of keys to replace.
   */
  overrideValues(replacements) {
    expect(
        typeof replacements === 'object',
        'Replacements must be a dictionary object.');
